<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成都学区房 · 数智监测看板</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<script src="config.js"></script>
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<header class="top-bar">
  <div class="top-bar-inner">
    <div class="logo-area">
      <span class="logo-icon">🏠</span>
      <span class="logo-text">成都学区房 数智监测看板</span>
    </div>
    <div class="top-meta">
      <span class="meta-item">📅 数据更新：<b id="lastUpdate">--</b></span>
      <span class="meta-item">🔄 轮询频率：每30分钟</span>
      <span class="meta-item">💰 数据来源：贝壳网登录实抓</span>
      <span class="meta-item" id="summaryTotal"></span>
    </div>
  </div>
</header>

<main class="main-grid">

  <section class="left-panel">
    <div class="panel-header">
      <h2>🏘️ 小区详情</h2>
      <span class="panel-badge">金牛 · 青羊 · 成华</span>
    </div>
    <div id="leftPanels"></div>
  </section>

  <section class="center-panel">
    <div id="amapContainer"></div>
    <div class="map-legend">
      <span class="legend-item"><span class="legend-dot school"></span> 目标小学（14所）</span>
      <span class="legend-item"><span class="legend-dot ok"></span> 小区（达标）</span>
      <span class="legend-item"><span class="legend-dot warn"></span> 小区（超预算）</span>
      <span class="legend-item"><span class="legend-dot alert"></span> 小区（无解）</span>
      <span class="legend-item"><span class="legend-dot poi-shop"></span> 商场</span>
      <span class="legend-item"><span class="legend-dot poi-transit"></span> 铁(地铁)</span>
      <span class="legend-item"><span class="legend-dot poi-park"></span> 园(公园)
      <span class="legend-item"><span class="legend-dot poi-hospital"></span> 医(医院)</span>
      <span class="legend-item" style="color:#4fc3f7">━ ━ 路线（点击小区显示真実公交）</span>
    </div>
  </section>

  <section class="right-panel">
    <div class="panel-header">
      <h2>📊 价格变动监测</h2>
      <span class="panel-badge">近7日均价基准</span>
    </div>
    <div class="legend-compact">
      <span class="l-dot green-bg">≤0%</span>
      <span class="l-dot yellow-bg">0~10%</span>
      <span class="l-dot orange-bg">10~20%</span>
      <span class="l-dot red-bg">>20%</span>
    </div>
    <div id="rightPanels"></div>
  </section>

</main>

<script>
(function(){
  var script = document.createElement('script');
  script.src = 'https://webapi.amap.com/maps?v=' + DASHBOARD_CONFIG.amapVersion + '&key=' + DASHBOARD_CONFIG.amapKey;
  script.onload = function(){ console.log('高德SDK加载完成'); window.dispatchEvent(new Event('amap-ready')); };
  script.onerror = function(){ console.error('高德SDK加载失败，请检查Key'); };
  document.head.appendChild(script);
})();
</script>
<script src="js/dashboard.js"></script>
</body>
</html>
